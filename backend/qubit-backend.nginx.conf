# Qubit Backend Nginx Configuration Template
#
# Replace the following placeholders before deploying:
#   {{DOMAIN}}        - Your domain name (e.g., example.com)
#   {{FRONTEND_ROOT}} - Path to frontend build files (e.g., /var/www/qubit)
#   {{BACKEND_PORT}}  - FastAPI backend port (e.g., 8000)

# redirect HTTP to HTTPS
server {
    server_name {{DOMAIN}};

    # IMPORTANT: allow Certbot challenge
    #location /.well-known/acme-challenge/ {
    #    root /var/lib/letsencrypt;
    #    try_files $uri =404;
    #}

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }



    #listen [::]:443 ssl ipv6only=on; # managed by Certbot
    #listen 443 ssl; # managed by Certbot
    #ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem; # managed by Certbot
    #ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem; # managed by Certbot
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# HTTPS server
server {
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    server_name {{DOMAIN}};


    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # SSL certificates (certbot should add these automatically)
    #ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;

    root {{FRONTEND_ROOT}};
    index index.html;

    # proxy to FastAPI backend
    location /api {
        proxy_pass http://localhost:{{BACKEND_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # server frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # logging
    access_log /var/log/nginx/qubit-backend-access.log;
    error_log /var/log/nginx/qubit-backend-error.log;
}

